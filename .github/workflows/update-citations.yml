name: Update citation counts

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation counts
        run: python scripts/update-citations.py

      - name: Commit updated counts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update citation counts"
          file_pattern: assets/data/citations.json
